<script>
/* 古い予約リンク（/?id=…、/?cambio=1&id=…）は予約ページ /reserva/ に同じパラメータのまま移す。lang だけのときは移さない。 */
(function(){var q=new URLSearchParams(location.search);if(q.has('id')||q.has('cambio')){location.replace('/reserva/'+location.search+location.hash);}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE HOME Hair re-creative</title>

<meta property="og:title" content="THE HOME Hair re-creative">

<!-- 下書き（2026-10-04 ホームページ担当・新構成：thehomehair.com のトップ）。公開はNoryが決める。事実は 資料/美容室.md のみ。 -->
<link href="https://fonts.googleapis.com/css2?family=Diplomata+SC&family=Yeseva+One&family=Kaisei+Decol:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--paper:#fff;--ink:#1d1d1d;--mute:#6b6660;--line:#e3ddd3;--soft:#faf8f4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kaisei Decol',serif;line-height:1.75}
.w{width:100%;max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh;padding:20px 16px 40px;overflow-x:hidden}
.langs{display:flex;justify-content:center;gap:16px;font-size:13px;margin:0 0 14px}
.langs a{color:#999;text-decoration:none;cursor:pointer;padding:2px 0}
.langs a.on{color:var(--ink);font-weight:700;border-bottom:1px solid var(--ink)}
header{text-align:center}
.logo{display:block;width:120px;height:120px;margin:0 auto;border-radius:50%;object-fit:cover}
h1{font-family:'Diplomata SC',serif;font-size:22px;letter-spacing:.06em;margin:12px 0 0;font-weight:400}
.tag{color:var(--mute);font-size:14px;margin:2px 0 0}
.lead{font-size:15px;margin:18px auto 0;max-width:440px}
.btn{display:block;width:100%;max-width:380px;margin:12px auto 0;text-align:center;text-decoration:none;border-radius:12px;padding:14px 12px;font-size:16px;font-family:inherit;line-height:1.4}
.btn.dark{background:var(--ink);color:#fff;font-weight:700}
.btn.line{background:transparent;color:var(--ink);border:1.2px solid var(--ink)}
.btn small{display:block;font-size:12px;font-weight:400;opacity:.8}
.row{display:flex;gap:10px;max-width:380px;margin:10px auto 0}
.row .btn{margin:0;font-size:14px;padding:12px 6px}
section{margin:36px 0 0}
h2{font-family:'Yeseva One','Kaisei Decol',serif;font-weight:400;font-size:20px;letter-spacing:.02em;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px}
.card{background:var(--soft);border-radius:14px;padding:14px 16px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
tr:last-child td{border-bottom:none}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
ul{margin:0;padding-left:18px}
li{margin:4px 0;font-size:15px}
.addr{margin:0;font-size:15px}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:40px;line-height:1.9}
footer a{color:var(--mute)}
</style>
</head>
<body>
<div class="w">

</section>

    </table>
    <p class="note" data-t="spaNote"></p>

<section>
  <h2 data-t="hoursH"></h2>

      <tr><td data-t="d1"></td><td>10:00 – 19:00</td></tr>

<section>
  <h2 data-t="policyH"></h2>

    <ul>
      <li data-t="p0"></li>
      <li data-t="p1"></li>
      <li data-t="p2"></li>
      <li data-t="p3"></li>
      <li data-t="p4"></li>
    </ul>
  </div>
</section>

<section>
  <h2 data-t="shopH"></h2>
  <p style="margin:0;font-size:15px" data-t="shopTx"></p>
  <a class="btn line" href="/productos.html" data-href="productos" data-t="shopBtn"></a>
</section>

<section>
  <h2 data-t="accessH"></h2>
  <div class="card">
    <p class="addr">Calle Ensenada 138, Condesa,<br>C.P. 06100, CDMX</p>
  </div>
  <a class="btn line" href="https://www.google.com/maps/place/The+Home+Hair+re-creative/@19.4062426,-99.1765919,17z" data-t="map"></a>
  <a class="btn line" href="https://www.google.com/search?q=The+Home+Hair+re-creative#lrd=0x85d1ff55b28da79f:0xdb3a8bbdf2c8606b,3,,,," data-t="reviews"></a>
</section>

<footer>
  THE HOME Hair re-creative<br>
  <a href="https://www.instagram.com/the_home_hair_re_creative/">Instagram @the_home_hair_re_creative</a><br>
  <a href="https://www.instagram.com/nory_thehomehair/">Styles @nory_thehomehair</a>
</footer>
</div>

<script>
const TX={
lead:{es:'Un salón japonés en la Condesa. Atendemos con cita, con tiempo y atención dedicados a cada persona.',
 en:'A Japanese hair salon in Condesa. By appointment only, with time and attention dedicated to each guest.',
 ja:'コンデサの日本人美容室です。完全予約制で、お一人おひとりに時間をかけてご対応いたします。'},
book:{es:'Reservar cita',en:'Book an appointment',ja:'ご予約'},

m2:{es:'Corte · dama',en:'Haircut · women',ja:'カット（レディース）'},
m3:{es:'Corte de fleco',en:'Bangs trim',ja:'前髪カット'},
m4:{es:'Color',en:'Color',ja:'カラー'},
m5:{es:'Permanente',en:'Perm',ja:'パーマ'},
m6:{es:'Alaciado japonés',en:'Japanese hair straightening',ja:'縮毛矯正'},
m7:{es:'Tratamiento',en:'Treatment',ja:'トリートメント'},
from1300:{es:'desde $1,300',en:'from $1,300',ja:'$1,300〜'},
from1500:{es:'desde $1,500',en:'from $1,500',ja:'$1,500〜'},
from3000:{es:'desde $3,000',en:'from $3,000',ja:'$3,000〜'},
menuNote:{es:'Precios en pesos mexicanos, IVA incluido.',
 en:'Prices in Mexican pesos, VAT (IVA) included.',
 ja:'料金はメキシコペソ・IVA（消費税）込みです。'},
spaH:{es:'Head spa',en:'Head spa',ja:'ヘッドスパ'},
spa1:{es:'Añadido a otro servicio (15 min)',en:'Added to another service (15 min)',ja:'ほかのメニューに追加（15分）'},
spa2:{es:'Head spa con lavado y peinado (40 min – 1 h)',en:'Head spa with shampoo and styling (40 min – 1 hr)',ja:'ヘッドスパのみ・シャンプーとスタイリング込み（40分〜1時間）'},
spaNote:{es:'Masaje de 15 minutos. El precio varía según el largo del cabello. IVA incluido.',
 en:'A 15-minute massage. Price varies with hair length. VAT included.',
 ja:'マッサージは15分です。料金は髪の長さにより異なります。IVA込み。'},
hoursH:{es:'Horario',en:'Hours',ja:'営業時間'},
d1:{es:'Martes a viernes',en:'Tuesday – Friday',ja:'火曜〜金曜'},
d2:{es:'Sábado',en:'Saturday',ja:'土曜'},
d3:{es:'Domingo',en:'Sunday',ja:'日曜'},
closed:{es:'Cerrado todos los lunes, el 1.er y 3.er martes, y el 3.er domingo de cada mes. Puede haber otros días de descanso; consulte el calendario.',
 en:'Closed every Monday, on the 1st and 3rd Tuesday, and on the 3rd Sunday of each month. There may be additional days off; please check the calendar.',
 ja:'定休日：毎週月曜日、第1・第3火曜日、第3日曜日。このほかに臨時休業がございます。カレンダーでご確認ください。'},
calendar:{es:'Ver calendario de apertura',en:'View opening calendar',ja:'営業日カレンダーを見る'},
policyH:{es:'Antes de su visita',en:'Before your visit',ja:'ご来店の前に'},
p0:{es:'Solo con cita.',en:'By appointment only.',ja:'完全予約制です。'},
p1:{es:'Formas de pago: efectivo, tarjeta de crédito o débito. No aceptamos American Express.',
 en:'Payment: cash, credit or debit card. American Express is not accepted.',
 ja:'お支払い：現金、クレジットカード、デビットカード（American Expressはご利用いただけません）。'},
p2:{es:'Cambios y cancelaciones: hasta las 10:00 a.m. del día anterior. Después de ese horario se cobra el 100% del servicio.',
 en:'Changes and cancellations: until 10:00 a.m. the day before. After that time, 100% of the service is charged.',
 ja:'ご予約の変更・キャンセル：前日の午前10時まで。それ以降は料金の100%を頂戴いたします。'},
p3:{es:'Un retraso de 15 minutos o más se considera cancelación (100%).',
 en:'Arriving 15 minutes late or more is treated as a cancellation (100%).',
 ja:'15分以上のご遅刻は、キャンセル扱い（100%）とさせていただきます。'},
p4:{es:'Le agradecemos traer una foto del estilo que desea.',
 en:'We kindly ask you to bring a photo of the style you would like.',
 ja:'ご希望の髪型のお写真をお持ちください。'},
shopH:{es:'Productos',en:'Products',ja:'店頭商品'},
shopTx:{es:'Productos Davines disponibles en el salón.',en:'Davines products available at the salon.',ja:'サロンでDavinesの商品をお求めいただけます。'},
shopBtn:{es:'Ver productos',en:'View products',ja:'商品を見る'},
accessH:{es:'Ubicación',en:'Location',ja:'アクセス'},
map:{es:'Abrir en Google Maps',en:'Open in Google Maps',ja:'Googleマップで開く'},
reviews:{es:'Reseñas en Google',en:'Google reviews',ja:'Googleのクチコミ'}
};
const LS=['es','en','ja'];
let L=(new URLSearchParams(location.search).get('lang')||(navigator.language||'es').slice(0,2)).toLowerCase();
if(LS.indexOf(L)<0)L='es';
const BASE={horario:'/horario.html',productos:'/productos.html'};
function draw(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TX[e.dataset.t][L]);
 document.querySelectorAll('[data-href]').forEach(e=>e.href=BASE[e.dataset.href]+'?lang='+L);
 const b=document.getElementById('langs');b.innerHTML='';
 [['es','Español'],['en','English'],['ja','日本語']].forEach(([k,n])=>{const a=document.createElement('a');a.textContent=n;a.className=k===L?'on':'';a.onclick=()=>{L=k;draw();};b.appendChild(a);});
}
draw();
</script>
