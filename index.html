<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>THE HOME Hair re-creative – Reserva</title><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Diplomata+SC&family=Yeseva+One&family=Kaisei+Decol:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ec;font-family:'Yeseva One','Kaisei Decol',serif;color:#1d1d1d}
.w{width:100%;max-width:480px;overflow-x:hidden;margin:0 auto;background:#fff;min-height:100vh;padding:18px 16px 40px}
.logo{display:block;width:110px;height:110px;margin:4px auto 6px;border-radius:50%}
h1{font-family:'Diplomata SC',serif;font-size:22px;text-align:center;margin:6px 0 0;letter-spacing:.5px}
.sub{text-align:center;font-size:14px;color:#555;margin:4px 0 14px}
.step{margin:18px 0 8px;font-size:17px;border-bottom:1px solid #ddd;padding-bottom:6px}
.step small{font-family:'Kaisei Decol';color:#777;font-size:12px;margin-left:6px}
.menus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.langs{text-align:center;margin:2px 0 10px;font-size:13px}.langs a{color:#888;text-decoration:none;margin:0 8px}.langs a.on{color:#1d1d1d;font-weight:bold;text-decoration:underline}
.chip{border:1.5px solid #222;border-radius:12px;padding:9px 8px;background:#fff;font:inherit;font-size:14px;line-height:1.25;text-align:center;cursor:pointer}
.chip span{display:block;font-size:12px;color:#666}
.chip:disabled{opacity:.3;cursor:default}
.chip.on{background:#1d1d1d;color:#fff}.chip.on span{color:#ddd}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.cal-h button{border:none;background:none;font-size:26px;padding:0 12px;cursor:pointer}
.cal-h div{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.dow{font-size:12px;color:#888;padding:4px 0}
.d{padding:10px 0;border-radius:10px;font-size:16px;border:none;background:#f1efea;font-family:inherit;cursor:pointer}
.d.off{background:none;color:#ccc;cursor:default;text-decoration:line-through}
.d.on{background:#1d1d1d;color:#fff}
.d.blank{background:none;cursor:default}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.t{border:1.5px solid #222;border-radius:10px;padding:10px 0;background:#fff;font:inherit;font-size:16px;cursor:pointer}
.t.on{background:#1d1d1d;color:#fff}
.hint{font-size:13px;color:#888;font-family:'Kaisei Decol',serif}
.inp{display:block;width:100%;border:1.5px solid #ccc;border-radius:10px;padding:11px 10px;font:inherit;font-size:16px;margin-top:8px}
textarea{width:100%;border:1.5px solid #ccc;border-radius:10px;padding:10px;font:inherit;font-size:15px;min-height:60px}
.go{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:14px;background:#b00020;color:#fff;font:inherit;font-size:18px;cursor:pointer}
.go:disabled{background:#ccc}
.sum{background:#f4f1ec;border-radius:12px;padding:12px;font-size:15px;margin-top:14px;line-height:1.6}
.done{text-align:center;padding:30px 6px}
.done .big{font-size:40px}
.done p{line-height:1.6}
.ig{display:inline-block;margin-top:14px;padding:12px 18px;border:1.5px solid #222;border-radius:30px;color:#222;text-decoration:none}
.err{color:#b00020;font-size:14px;margin-top:10px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.opt{border:1.5px solid #ccc;border-radius:10px;padding:7px 4px;background:#fff;font:inherit;font-size:13px;text-align:center;cursor:pointer;line-height:1.3}
.opt.on{border-color:#1d1d1d;box-shadow:0 0 0 1.5px #1d1d1d}
.opt b{display:block;font-size:12px;color:#777;font-weight:normal}
.photo{background:#fff4e5;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:10px;font-family:'Kaisei Decol',serif}
</style></head>

const DUR_COLOR = [90, 90, 210, 210];                 // 全体 / リタッチ / ハイライト / ダブル
const DUR_COLOR_RETOUCH_BLEACH = 120;                 // リタッチ（ブリーチあり）
const DUR_STRAIGHT = [210, 150, 60, 90];            // 全体3時間半 / リタッチ2時間半 / 前髪 / 前髪と横
const DIAS={es:['dom','lun','mar','mié','jue','vie','sáb'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ja:['日','月','火','水','木','金','土']}[LANG];
const MESES={es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],en:['January','February','March','April','May','June','July','August','September','October','November','December'],ja:null}[LANG];
const CTYPES=[['Color completo',{es:'Color completo',en:'Full color',ja:'全体カラー'}],['Retoque de raíz',{es:'Retoque de raíz',en:'Root touch-up',ja:'リタッチ（根元）'}],['Mechas',{es:'Mechas',en:'Highlights',ja:'ハイライト'}],['Doble color',{es:'Doble color',en:'Double color (bleach)',ja:'ダブルカラー'}]];
const STYPES=[['Completo',{es:'Completo',en:'Full',ja:'全体'}],['Retoque de raíz',{es:'Retoque de raíz',en:'Root touch-up',ja:'リタッチ（根元）'}],['Solo flequillo',{es:'Solo flequillo',en:'Bangs only',ja:'前髪だけ'}],['Flequillo y lados',{es:'Flequillo y lados',en:'Bangs & sides',ja:'前髪と横'}]];
const sel={menus:[],ctype:null,bleach:null,stype:null,opts:[{date:null,time:null},{date:null,time:null},{date:null,time:null}],cur:0};
Object.defineProperty(sel,'date',{get(){return sel.opts[sel.cur].date},set(v){sel.opts[sel.cur].date=v}});
Object.defineProperty(sel,'time',{get(){return sel.opts[sel.cur].time},set(v){sel.opts[sel.cur].time=v}});
const OPTN=T('opt');
function nowMx(){const s=new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'});return new Date(s);}
const NOW=nowMx(); const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const LAST=new Date(TODAY); LAST.setDate(LAST.getDate()+60);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function closed(d){const w=d.getDay(),n=Math.ceil(d.getDate()/7);if(w===1)return true;if(w===2&&(n===1||n===3))return true;if(w===0&&n===3)return true;return EXTRA.indexOf(ymd(d))>=0;}
function dur(){let t=0;const perm=sel.menus.indexOf(4)>=0;sel.menus.forEach(i=>{if(perm&&(i===0||i===1))return;if(DUR_MENU[i])t+=DUR_MENU[i];else if(i===4)t+=(sel.menus.indexOf(0)>=0&&sel.menus.indexOf(1)<0)?DUR_PERM_MEN:DUR_PERM_WOMEN;else if(i===3)t+=(sel.ctype===1&&sel.bleach===1)?DUR_COLOR_RETOUCH_BLEACH:DUR_COLOR[sel.ctype===null?0:sel.ctype];else if(i===5)t+=DUR_STRAIGHT[sel.stype===null?0:sel.stype];});return t;}
const hm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
function slots(d){const w=d.getDay();let last;if(w===0)last=OPEN;else if(CLOSE[w])last=CLOSE[w]-Math.max(dur(),30);else return[];const out=[];for(let x=OPEN;x<=last;x+=30){const t=new Date(d);t.setHours(Math.floor(x/60),x%60,0,0);if(t-NOW>=2*3600e3)out.push(String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'));}return out;}
// menus
const mEl=document.getElementById('menus');
MENUS.forEach((m,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=m[1][LANG]+'<span>'+price(m)+'</span>';b.onclick=()=>{const k=sel.menus.indexOf(i);if(k>=0)sel.menus.splice(k,1);else sel.menus.push(i);b.classList.toggle('on');colorUI();upd();};mEl.appendChild(b);});
const cEl=document.getElementById('ctypes');
CTYPES.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[1][LANG];b.onclick=()=>{sel.ctype=i;[...cEl.children].forEach((x,k)=>x.classList.toggle('on',k===i));bleachUI();upd();};cEl.appendChild(b);});
const BTYPES=[['Sin decoloración',{es:'Sin decoloración',en:'No bleach',ja:'ブリーチなし'}],['Con decoloración',{es:'Con decoloración',en:'With bleach',ja:'ブリーチあり'}]];
const bEl=document.getElementById('btypes');
BTYPES.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[1][LANG];b.onclick=()=>{sel.bleach=i;[...bEl.children].forEach((x,k)=>x.classList.toggle('on',k===i));upd();};bEl.appendChild(b);});
function bleachUI(){const on=sel.ctype===1;document.getElementById('bleachBox').style.display=on?'block':'none';if(!on){sel.bleach=null;[...bEl.children].forEach(x=>x.classList.remove('on'));}}
const sEl=document.getElementById('stypes');
STYPES.forEach((c,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=c[1][LANG];b.onclick=()=>{sel.stype=i;[...sEl.children].forEach((x,k)=>x.classList.toggle('on',k===i));upd();};sEl.appendChild(b);});
function straightUI(){const on=sel.menus.indexOf(5)>=0;document.getElementById('straightBox').style.display=on?'block':'none';if(!on){sel.stype=null;[...sEl.children].forEach(x=>x.classList.remove('on'));}}
function colorUI(){straightUI();const on=sel.menus.indexOf(3)>=0;document.getElementById('colorBox').style.display=on?'block':'none';if(!on){sel.ctype=null;[...cEl.children].forEach(x=>x.classList.remove('on'));}bleachUI();}
// 写真をDMで送ってもらう：カラー（全部）・パーマ・縮毛矯正
function needPhoto(){return sel.menus.indexOf(3)>=0||sel.menus.indexOf(4)>=0||sel.menus.indexOf(5)>=0;}
// カットだけの人：来店時に写真を持ってきてもらう
function cutPhoto(){return !needPhoto()&&(sel.menus.indexOf(0)>=0||sel.menus.indexOf(1)>=0||sel.menus.indexOf(2)>=0);}
function fmtOpt(o){if(!o.date)return '—';const t=o.time?' '+o.time:' —';if(LANG==='ja')return (o.date.getMonth()+1)+'/'+o.date.getDate()+'('+DIAS[o.date.getDay()]+')'+t;if(LANG==='en')return DIAS[o.date.getDay()]+' '+(o.date.getMonth()+1)+'/'+o.date.getDate()+t;return DIAS[o.date.getDay()]+' '+o.date.getDate()+'/'+(o.date.getMonth()+1)+t;}
const durTxt=d=>LANG==='ja'?(d>=60?Math.floor(d/60)+'時間':'')+(d%60?d%60+'分':''):(d>=60?Math.floor(d/60)+' h ':'')+(d%60?d%60+' min':'');
function drawOpts(){const e=document.getElementById('opts');e.innerHTML='';sel.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(i===sel.cur?' on':'');b.innerHTML='<b>'+OPTN[i]+'</b>'+fmtOpt(o);b.onclick=()=>{sel.cur=i;drawOpts();drawCal();drawTimes();};e.appendChild(b);});}
// calendar
let view=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
function drawCal(){const g=document.getElementById('grid');g.innerHTML='';document.getElementById('mon').textContent=LANG==='ja'?view.getFullYear()+'年'+(view.getMonth()+1)+'月':MESES[view.getMonth()]+' '+view.getFullYear();
 ({es:['D','L','M','M','J','V','S'],en:['S','M','T','W','T','F','S'],ja:['日','月','火','水','木','金','土']}[LANG]).forEach(x=>{const e=document.createElement('div');e.className='dow';e.textContent=x;g.appendChild(e);});
 for(let i=0;i<view.getDay();i++){const e=document.createElement('div');e.className='d blank';g.appendChild(e);}
 const last=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
 for(let day=1;day<=last;day++){const d=new Date(view.getFullYear(),view.getMonth(),day);const b=document.createElement('button');b.textContent=day;
  const ok=d>=TODAY&&d<=LAST&&!closed(d)&&slots(d).length>0;b.className='d'+(ok?'':' off')+(sel.date&&ymd(sel.date)===ymd(d)?' on':'');
  if(ok)b.onclick=()=>{sel.date=d;sel.time=null;drawCal();drawTimes();drawOpts();upd();};else b.disabled=true;g.appendChild(b);}
 document.getElementById('prev').disabled=view<=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
}
document.getElementById('prev').onclick=()=>{if(view>new Date(TODAY.getFullYear(),TODAY.getMonth(),1)){view=new Date(view.getFullYear(),view.getMonth()-1,1);drawCal();}};
document.getElementById('next').onclick=()=>{const n=new Date(view.getFullYear(),view.getMonth()+1,1);if(n<=LAST){view=n;drawCal();}};
function drawTimes(){const t=document.getElementById('times');t.innerHTML='';if(!sel.date){t.innerHTML='<div class="hint" style="grid-column:1/-1">'+T('pickDay')+'</div>';return;}slots(sel.date).forEach(s=>{const b=document.createElement('button');const taken=sel.opts.some((o,i)=>i!==sel.cur&&o.date&&ymd(o.date)===ymd(sel.date)&&o.time===s);b.className='t'+(sel.time===s?' on':'');b.textContent=s;if(taken){b.disabled=true;b.style.opacity='.3';}b.onclick=()=>{sel.time=s;drawTimes();drawOpts();upd();if(sel.cur<2&&!sel.opts[sel.cur+1].date){sel.cur++;drawOpts();drawCal();drawTimes();}};t.appendChild(b);});}
function showMenus(){return sel.menus.map(i=>i===3&&sel.ctype!==null?MENUS[3][1][LANG]+' ('+CTYPES[sel.ctype][1][LANG]+(sel.ctype===1&&sel.bleach!==null?', '+BTYPES[sel.bleach][1][LANG]:'')+')':(i===5&&sel.stype!==null?MENUS[5][1][LANG]+' ('+STYPES[sel.stype][1][LANG]+')':MENUS[i][1][LANG])).join(' + ');}
function menuText(){return sel.menus.map(i=>i===3&&sel.ctype!==null?'Color ('+CTYPES[sel.ctype][0]+(sel.ctype===1&&sel.bleach!==null?', '+BTYPES[sel.bleach][0].toLowerCase():'')+')':(i===5&&sel.stype!==null?'Alaciado ('+STYPES[sel.stype][0]+')':MENUS[i][0])).join(' + ');}
let lastDur=-1;
function revalidate(){sel.opts.forEach(o=>{if(o.date){const ok=slots(o.date);if(!ok.length){o.date=null;o.time=null;}else if(o.time&&ok.indexOf(o.time)<0)o.time=null;}});drawCal();drawTimes();drawOpts();}
function endTxt(o){const a=o.time.split(':');const e=(+a[0])*60+(+a[1])+dur();return o.date.getDay()===0?'':' → '+hm(e);}
// 選んだ時間から閉店までに終わらないメニューは押せなくする
function fitsWith(ch){const b={m:sel.menus.slice(),c:sel.ctype,bl:sel.bleach,s:sel.stype};ch();const ok=sel.opts.every(o=>!(o.date&&o.time)||slots(o.date).indexOf(o.time)>=0);sel.menus=b.m;sel.ctype=b.c;sel.bleach=b.bl;sel.stype=b.s;return ok;}
function lock(){[...mEl.children].forEach((x,i)=>{x.disabled=sel.menus.indexOf(i)<0&&!fitsWith(()=>{sel.menus.push(i);if(i===3&&sel.ctype===null)sel.ctype=0;if(i===5&&sel.stype===null)sel.stype=2;});});
 [...cEl.children].forEach((x,i)=>{x.disabled=sel.ctype!==i&&!fitsWith(()=>{sel.ctype=i;if(i!==1)sel.bleach=null;});});
 [...bEl.children].forEach((x,i)=>{x.disabled=sel.bleach!==i&&!fitsWith(()=>{sel.bleach=i;});});
 [...sEl.children].forEach((x,i)=>{x.disabled=sel.stype!==i&&!fitsWith(()=>{sel.stype=i;});});
 const any=[...mEl.children,...cEl.children,...bEl.children,...sEl.children].some(x=>x.disabled);document.getElementById('lockNote').style.display=any?'block':'none';}
function upd(){const dd=dur();if(dd!==lastDur){lastDur=dd;revalidate();}const ms=menuText();const o=sel.opts.filter(x=>x.date&&x.time);
 document.getElementById('photoNote').style.display=needPhoto()?'block':'none';
 document.getElementById('cutNote').style.display=cutPhoto()?'block':'none';
 document.getElementById('sum').innerHTML=(showMenus()||T('menuNone'))+'<br>'+(o.length?o.map((x,i)=>OPTN[sel.opts.indexOf(x)]+': '+fmtOpt(x)+(dur()?endTxt(x):'')).join('<br>')+(dur()?'<br><small>⏱ '+(LANG==='ja'?T('dur')+'：'+durTxt(dur()):durTxt(dur())+' '+T('dur'))+'</small>':''):T('dtNone'));
 const colorOk=(sel.menus.indexOf(3)<0||(sel.ctype!==null&&(sel.ctype!==1||sel.bleach!==null)))&&(sel.menus.indexOf(5)<0||sel.stype!==null);
 document.getElementById('go').disabled=!(ms&&colorOk&&sel.opts[0].date&&sel.opts[0].time&&ID&&nameOk()&&telOk()&&mailOk());lock();}
function nameOk(){return document.getElementById('name').value.trim().length>=2;}
function telOk(){return document.getElementById('tel').value.replace(/[^0-9]/g,'').length>=10;}
function mailOk(){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('mail').value.trim());}
['name','tel','mail'].forEach(i=>document.getElementById(i).addEventListener('input',upd));
document.getElementById('go').onclick=()=>{const b=document.getElementById('go');b.disabled=true;b.textContent=T('sending');document.getElementById('err').textContent='';
 fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:ID,menu:menuText(),photo:needPhoto(),opts:sel.opts.filter(x=>x.date&&x.time).map(x=>({date:ymd(x.date),time:x.time})),name:document.getElementById('name').value.trim(),tel:document.getElementById('tel').value.trim(),mail:document.getElementById('mail').value.trim(),note:document.getElementById('note').value,lang:LANG})}).then(x=>x.json()).then(r=>{if(r&&r.ok){document.getElementById('app').innerHTML='<img class="logo" src="'+document.querySelector('.logo').src+'"><div class="done"><div class="big">✓</div><h1>'+T('doneT')+'</h1><p>'+sel.opts.filter(x=>x.date&&x.time).map((x,i)=>OPTN[i]+': '+fmtOpt(x)).join('<br>')+'<br>'+showMenus()+'</p>'+(needPhoto()?'<div class="photo">'+document.getElementById('photoNote').innerHTML+'</div>':'')+(cutPhoto()?'<div class="photo">'+T('cutPhoto')+'</div>':'')+'<p>'+T('doneC')+'</p><a class="ig" href="https://ig.me/m/the_home_hair_re_creative">'+T('back')+'</a></div>';}
  else{b.disabled=false;b.textContent=T('send');document.getElementById('err').textContent=T('err');}}).catch(()=>{b.disabled=false;b.textContent=T('send');document.getElementById('err').textContent=T('err');});};
if(!ID){document.getElementById('err').textContent=T('noId');}
document.documentElement.lang=LANG;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));
document.getElementById('name').placeholder=T('name');document.getElementById('tel').placeholder=T('tel');document.getElementById('mail').placeholder=T('mail');document.getElementById('note').placeholder=T('optional');
document.getElementById('go').textContent=T('send');
(()=>{const L=document.getElementById('langs');[['es','Español'],['en','English'],['ja','日本語']].forEach(([k,n])=>{const a=document.createElement('a');a.textContent=n;a.className=k===LANG?'on':'';const u=new URL(location.href);u.searchParams.set('lang',k);a.href=u.toString();L.appendChild(a);});})();
drawTimes();drawOpts();drawCal();upd();
</script>
</body></html>
