<!-- 【下書き 10/4】予約の変更・キャンセル（前日のお知らせメールのボタンから開く。インスタのログイン不要）
     開き方：https://noryjp.github.io/reserva/cambio.html?id={Contact Id}&lang=es|en|ja
     ・今の予約（日時・メニュー）は Apps Script の ?action=myres で読む（名前・電話は出ない）

*{box-sizing:border-box}

.done .big{font-size:40px}
.done p{line-height:1.6}

<h1 id="h1"></h1>
<div class="sub">THE HOME Hair re-creative</div>
<div class="langs" id="langs"></div>
<div id="app"><div class="msg info" id="loading"></div></div>
</div>
<script>
const LANGS=['es','en','ja'];
let LANG=(new URLSearchParams(location.search).get('lang')||'').toLowerCase();
if(LANGS.indexOf(LANG)<0){const n=(navigator.language||'es').slice(0,2).toLowerCase();LANG=LANGS.indexOf(n)>=0?n:'es';}
const TX={
title:{es:'Cambio o cancelación',en:'Change or cancel',ja:'ご予約の変更・キャンセル'},
loading:{es:'Cargando su cita…',en:'Loading your appointment…',ja:'ご予約を読み込み中…'},
cur:{es:'Su cita',en:'Your appointment',ja:'現在のご予約'},
until:{es:'Cambios y cancelaciones hasta:',en:'Changes and cancellations until:',ja:'変更・キャンセルの受付：'},
change:{es:'Cambiar fecha y hora',en:'Change date & time',ja:'日時を変更する'},
changeN:{es:'Elija la nueva fecha en el calendario (hasta 3 opciones). Su cita actual se mantiene hasta que le confirmemos la nueva.',en:'Choose the new date on the calendar (up to 3 options). Your current appointment stays until we confirm the new one.',ja:'カレンダーから新しい日時を選べます（第3希望まで）。新しい日時が確定するまでは、現在のご予約のままです。'},
cancel:{es:'Cancelar mi cita',en:'Cancel my appointment',ja:'キャンセルする'},
cQ:{es:'¿Desea cancelar esta cita?',en:'Do you want to cancel this appointment?',ja:'このご予約をキャンセルしますか？'},
cYes:{es:'Sí, cancelar',en:'Yes, cancel',ja:'はい、キャンセルします'},
cNo:{es:'No, volver',en:'No, go back',ja:'いいえ、戻る'},
sending:{es:'Enviando…',en:'Sending…',ja:'送信中…'},
doneT:{es:'Recibido',en:'Received',ja:'受け付けました'},
doneC:{es:'Hemos recibido su solicitud de cancelación. Le llegará un aviso de confirmación.',en:'We have received your cancellation request. You will receive a confirmation notice.',ja:'キャンセルのご連絡を受け付けました。確認のお知らせが届きます。'},
thanks:{es:'Muchas gracias por avisarnos.',en:'Thank you for letting us know.',ja:'ご連絡ありがとうございます。'},
closed:{es:'El plazo para cambios y cancelaciones es hasta las 10:00 a.m. del día anterior a su cita, por lo que ya no es posible realizarlo.',en:'Changes and cancellations are accepted until 10:00 a.m. the day before your appointment, so this is no longer possible.',ja:'ご予約の変更・キャンセルは、ご予約日の前日朝10時までとなっております。恐れ入りますが、受付期間を過ぎております。'},
none:{es:'No encontramos una cita confirmada. Si ya la canceló, no necesita hacer nada más.',en:'We could not find a confirmed appointment. If you already cancelled, no further action is needed.',ja:'確定済みのご予約が見つかりませんでした。すでにキャンセル済みの場合は、このままで大丈夫です。'},
noId:{es:'Abra esta página desde el botón de su correo.',en:'Please open this page from the button in your email.',ja:'メールのボタンから開いてください。'},
err:{es:'Error. Inténtelo de nuevo en unos minutos.',en:'Error. Please try again in a few minutes.',ja:'エラーです。少し時間をおいて、もう一度お試しください。'},
};
const T=k=>TX[k][LANG];
const ID=(new URLSearchParams(location.search).get('id')||'').replace(/[^0-9]/g,'');
const API='https://script.google.com/macros/s/AKfycbxGGZm0AkELBjTBPFG9R-02Gd5347Y1T3UPLeorJtgmFA6H3QC7FAk7Zq5Qk-TVc31C/exec';
// メニュー名（ManyChatの r_menu はスペイン語）を表示の言語に
const MN=[['Corte (hombre)',"Men's cut",'メンズカット'],['Corte (mujer)',"Women's cut",'レディースカット'],['Flequillo','Bang trim','前髪カット'],['Alaciado japonés','Japanese straightening','縮毛矯正'],['Alaciado','Japanese straightening','縮毛矯正'],['Permanente','Perm','パーマ'],['Tratamiento','Treatment','トリートメント'],['Color completo','Full color','全体カラー'],['Retoque de raíz','Root touch-up','リタッチ（根元）'],['Mechas','Highlights','ハイライト'],['Doble color','Double color','ダブルカラー'],['Color','Color','カラー'],['Sin decoloración','no bleach','ブリーチなし'],['Con decoloración','with bleach','ブリーチあり'],['sin decoloración','no bleach','ブリーチなし'],['con decoloración','with bleach','ブリーチあり'],['Completo','Full','全体'],['Solo flequillo','Bangs only','前髪だけ'],['Flequillo y lados','Bangs & sides','前髪と横']];
MN.sort((a,b)=>b[0].length-a[0].length); // 長い名前から置きかえる（「Flequillo y lados」を「Flequillo」より先に）
function menuTx(m){m=String(m||'').replace(/[<>&"]/g,'');if(LANG==='es')return m;const k=LANG==='en'?1:2;
 MN.forEach((x,i)=>{m=m.split(x[0]).join('\u0001'+i+'\u0002');});return m.replace(/\u0001(\d+)\u0002/g,(a,i)=>MN[+i][k]);}
const locale={es:'es-MX',en:'en-US',ja:'ja-JP'}[LANG];
const fmt=(ms,o)=>new Intl.DateTimeFormat(locale,Object.assign({timeZone:'America/Mexico_City'},o)).format(new Date(ms));
const fmtWhen=ms=>fmt(ms,{month:'long',day:'numeric',weekday:'short'})+' '+fmt(ms,{hour:'2-digit',minute:'2-digit',hour12:false});
const app=document.getElementById('app');
let RES=null;
function msg(cls,txt){app.innerHTML='<div class="msg '+cls+'"></div>';app.firstChild.textContent=txt;}
function card(){return '<div class="step">'+T('cur')+'</div><div class="card"><div class="when">'+fmtWhen(RES.start)+'</div>'+menuTx(RES.menu)+'<small>'+T('until')+' '+fmtWhen(RES.deadline)+'</small></div>';}
function home(){
 app.innerHTML=card()+
  '<a class="btn dark" id="ch">'+T('change')+'</a><div class="hint" style="margin-top:6px">'+T('changeN')+'</div>'+
  '<button class="btn line" id="cx">'+T('cancel')+'</button>';
 const u=new URL('./',location.href);u.searchParams.set('id',ID);u.searchParams.set('cambio','1');u.searchParams.set('lang',LANG);
 document.getElementById('ch').href=u.toString();
 document.getElementById('cx').onclick=ask;
}
function ask(){
 app.innerHTML=card()+'<p style="font-size:18px;text-align:center;margin:18px 0 0">'+T('cQ')+'</p>'+
  '<button class="btn red" id="yes">'+T('cYes')+'</button><button class="btn line" id="no">'+T('cNo')+'</button><div class="err" id="err"></div>';
 document.getElementById('no').onclick=home;
 document.getElementById('yes').onclick=()=>{const b=document.getElementById('yes');b.disabled=true;b.textContent=T('sending');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({mode:'cancel',id:ID,lang:LANG})})
  .then(x=>x.json()).then(r=>{
   if(r&&r.ok){app.innerHTML='<div class="done"><div class="big">✓</div><h1>'+T('doneT')+'</h1><p>'+T('thanks')+'<br>'+T('doneC')+'</p></div>';return;}
   if(r&&r.err==='plazo'){msg('shut',T('closed'));return;}
   if(r&&r.err==='no_res'){msg('info',T('none'));return;}
   b.disabled=false;b.textContent=T('cYes');document.getElementById('err').textContent=T('err');})
  .catch(()=>{b.disabled=false;b.textContent=T('cYes');document.getElementById('err').textContent=T('err');});};
}
document.documentElement.lang=LANG;
document.getElementById('h1').textContent=T('title');
document.getElementById('loading').textContent=T('loading');
(()=>{const L=document.getElementById('langs');[['es','Español'],['en','English'],['ja','日本語']].forEach(([k,n])=>{const a=document.createElement('a');a.textContent=n;a.className=k===LANG?'on':'';const u=new URL(location.href);u.searchParams.set('lang',k);a.href=u.toString();L.appendChild(a);});})();
if(!ID){msg('info',T('noId'));}
else fetch(API+'?action=myres&id='+ID).then(x=>x.json()).then(j=>{
 if(!j||!j.ok){msg('info',j&&j.err==='error'?T('err'):T('none'));return;}
 RES=j;
 // 締切はサーバーの判定（open）と、この端末の時計の両方で見る
 if(!j.open||Date.now()>=j.deadline){msg('shut',T('closed'));return;}
 home();
}).catch(()=>msg('info',T('err')));
</script>
