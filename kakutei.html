<!DOCTYPE html>
<html lang="ja"><head>
<!-- 【同じ見た目 10/16 仕組み担当・下書き】元＝公開中の kakutei.html（10/16 に thehomehair.com から写した）。変えたのは style と、ロゴと題の2行（.hd で包んだ）だけ。script・id・ボタン・確定の動きは1文字も変えていない。公開はしていない。 -->
<!-- 【料金の範囲 10/13 仕組み担当・下書き】元＝GitHub NORYjp/reserva の kakutei.html（10/13 の公開中と同じ）。違いは「料金の範囲 10/13」の所だけ。公開はしていない。
     料金の欄：type="number" → 文字の欄（4610〜4750 などの幅を入れられる）。「〜」を入れるボタンと、お客様に出る形の下見（読めない時は赤）を足した。
     Apps Script が v69 になる前に公開すると、幅を入れても料金表の金額で確定されてしまう → 必ず Apps Script（v69）を先に入れる。 -->
<!-- 【本人番号 10/7 仕組み担当・下書き】元＝web/kakutei.html（今の公開中）。違いは「本人番号 10/7」の所だけ。公開はしていない。
     cinfo に idWarn があるとき：確定ボタンの前に「🔴要確認：リンクの番号と予約した人が違う可能性」と、
     「お客様のメールに直接確定メールを送る（Googleの道）」／「今までどおり ManyChat で確定」を選ぶ欄を出す（はじめは Googleの道）。
     Apps Script が 下書き_Code_本人番号の注意.gs になる前に公開しても、idWarn が来ないので今と同じ見え方（害はない）。 -->
<!-- 【確定ボタン 10/5 仕組み担当・下書き】Noryだけが使う「予約の確定」ページ。通知メールのボタンから開く。
     Googleのログインに関係なく開ける（iPhoneでGoogleアカウントが複数でも開ける）。
     中身は Apps Script（API）の ?action=cinfo で読み、「確定する」は POST {action:'confirm'}。k（合い言葉）が合わないと何も読めない・確定できない。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>予約の確定 – The Home Hair</title>
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Diplomata+SC&family=Kaisei+Decol:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 【同じ見た目 10/16】お客様メールの報告・売上報告・ホームページと同じ空気（見た目だけ。下の script・id・ボタンの動きは1文字も変えていない） */
*{box-sizing:border-box}
body{margin:0;background:#efdcc6;font-family:'Kaisei Decol',sans-serif;color:#3a2a20}
.w{width:100%;max-width:480px;margin:0 auto;background:#fff;padding:0 16px 0;border-left:6px solid #b4532a;border-right:6px solid #b4532a}
.w::before{content:"";display:block;margin:0 -16px 0;height:29px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 22 17%22%3E%3Cpath d=%22M0 0 L22 0 L11 17 Z%22 fill=%22%23392920%22/%3E%3C/svg%3E") left 12px/22px 17px repeat-x,url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 12%22%3E%3Ccircle cx=%225%22 cy=%226%22 r=%222%22 fill=%22%23f7ebdd%22/%3E%3C/svg%3E") left 0/10px 12px repeat-x,linear-gradient(#b4532a,#b4532a) left top/100% 12px no-repeat;background-color:#f7ebdd}
.w::after{content:"";display:block;margin:32px -16px 0;height:29px;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 22 17%22%3E%3Cpath d=%22M0 17 L22 17 L11 0 Z%22 fill=%22%23392920%22/%3E%3C/svg%3E") left 0/22px 17px repeat-x,url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 12%22%3E%3Ccircle cx=%225%22 cy=%226%22 r=%222%22 fill=%22%23f7ebdd%22/%3E%3C/svg%3E") left 17px/10px 12px repeat-x,linear-gradient(#b4532a,#b4532a) left bottom/100% 12px no-repeat;background-color:#f7ebdd}
.hd{display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:4px 14px 8px;background:#f7ebdd}
.logo{display:block;width:56px;height:56px;margin:0;border-radius:50%;flex:none}
.hd small{display:block;font-family:Georgia,serif;font-size:11px;letter-spacing:3px;color:#b4532a}
h1{font-family:Georgia,'Kaisei Decol',serif;font-size:21px;text-align:left;margin:0;color:#3a2a20}
.card{background:#fffdf9;border:2.5px solid #5a3d2b;border-left:6px solid #b4532a;border-radius:6px;padding:12px 14px;line-height:1.6;font-size:16px}
.card .nm{font-size:22px;font-weight:700;font-family:Georgia,'Kaisei Decol',serif}
.card .dt{font-size:21px;font-weight:700;margin-top:4px;color:#b4532a;font-family:Georgia,'Kaisei Decol',serif}
.box{border-radius:6px;padding:10px 12px;margin:12px 0 0;font-size:15px;line-height:1.6;border:2px solid}
.red{background:#fbeeea;color:#9c2b23;border-color:#9c2b23}
.blue{background:#eef4f9;color:#2f6690;border-color:#2f6690}
.gray{background:#f7f2ec;color:#3a2a20;border-color:#cfc6bc}
label{display:block;margin-top:14px;font-size:15px;color:#5a3d2b;font-weight:700}
.inp{display:block;width:100%;border:2px solid #5a3d2b;border-radius:8px;padding:10px;font:inherit;font-size:19px;margin-top:6px;background:#fffdf9;color:#3a2a20}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:16px;color:#3a2a20}
.chk input{width:24px;height:24px;flex:none;accent-color:#b4532a}
.go{display:block;width:100%;margin-top:20px;padding:16px;border:2.5px solid #392920;border-radius:10px;background:#392920;color:#f7ebdd;font:inherit;font-family:Georgia,'Kaisei Decol',serif;font-size:20px;font-weight:700;letter-spacing:2px;cursor:pointer}
.go:disabled{background:#cfc6bc;border-color:#cfc6bc;color:#fff}
#msg{margin-top:14px;font-size:16px;line-height:1.6}
.ok{background:#eef5ee;color:#2e5e3a;border:2.5px solid #2e5e3a;border-radius:6px;padding:12px}
.ng{background:#fbeeea;color:#9c2b23;border:2.5px solid #9c2b23;border-radius:6px;padding:12px}
.load{text-align:center;color:#8a7b6c;padding:40px 0}
/* 本人番号 10/7 */
.warn{background:#9c2b23;color:#fff;border:2.5px solid #6b1a14;border-radius:6px;padding:12px;margin:12px 0 0;font-size:15px;line-height:1.6}
.warn b{font-size:16px}
.way{display:flex;gap:10px;align-items:flex-start;border:2px solid #9c2b23;border-radius:6px;padding:10px 12px;margin-top:10px;font-size:16px;line-height:1.5;background:#fff}
.way input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:#b4532a}
.way small{display:block;color:#7a6555;font-size:13px}
a{color:inherit}
/* 料金の範囲 10/13 */
.prw{display:flex;gap:8px;margin-top:6px}
.prw .inp{margin-top:0;flex:1;min-width:0}
.wave{flex:none;width:64px;border:2px solid #5a3d2b;border-radius:8px;background:#f7ebdd;font:inherit;font-size:22px;color:#3a2a20;cursor:pointer}
.pv{font-size:13px;color:#7a6555;margin-top:4px;min-height:1.2em}
.pv.bad{color:#9c2b23}
</style>
</head><body><div class="w">
<div class="hd"><img class="logo" src="logo_round.png" alt=""><div><small>THE HOME HAIR · RESERVA</small><h1>予約の確定</h1></div></div>
<div id="app"><div class="load">読み込み中…</div></div>
</div>
<script>
// Apps Script の API（予約ページ reserva/index.html と同じアドレス）
const API = 'https://script.google.com/macros/s/AKfycbxGGZm0AkELBjTBPFG9R-02Gd5347Y1T3UPLeorJtgmFA6H3QC7FAk7Zq5Qk-TVc31C/exec';
const Q = new URLSearchParams(location.search);
const R = Q.get('r') || '', O = Q.get('o') || '0', K = Q.get('k') || '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fail(t){ $('app').innerHTML = '<div class="ng">⚠️ ' + esc(t) + '</div>'; }
function dateJa(d, w){ const p = d.split('-'); return (+p[1]) + '/' + (+p[2]) + '（' + w + '）'; }
function durJa(m){ m = +m || 0; return (m >= 60 ? Math.floor(m / 60) + '時間' : '') + (m % 60 ? (m % 60) + '分' : ''); }

function show(j){
  let h = '<div class="card"><div class="nm">' + esc(j.name) + '</div>' +
    '<div>' + esc(j.menu) + (j.photo ? '・📸写真あり' : '') + '</div>' +
    '<div class="dt">' + dateJa(j.date, j.dow) + ' ' + (j.any ? '時間おまかせ' : esc(j.time)) + '</div>' +
    '<div style="font-size:13px;color:#666">目安 ' + durJa(j.dur) + '</div></div>';
  if (j.kind === 'cambio') h += '<div class="box red">変更の希望です。今の予約：' + esc(j.cur) + '<br>確定するまでは今の予約のままです。</div>';
  if (j.fam && j.fam.length > 1) h += '<div class="box gray">👪 同じメールのご家族（' + j.fam.length + '名）<br>' + j.fam.map(f => (f.me ? '<b>' : '') + esc(f.n + '人目 ' + f.name + '：' + f.st) + (f.me ? '（この人）</b>' : '')).join('<br>') + '</div>'; // 【家族 10/10】v53i の cinfo が fam を返す時だけ（今の Apps Script では出ない）
  if (j.direct) {
    const wa = String(j.tel || '').replace(/[^0-9]/g, '');
    h += '<div class="box blue">' + esc(j.src) + 'からの申し込み（DMなし）。<br>' +
      'WhatsApp：' + (wa ? '<a href="https://wa.me/' + wa + '">' + esc(j.tel) + '</a>' : 'なし') + '<br>' +
      'メール：' + (j.mail ? esc(j.mail) : 'なし') + '<br>' +
      (j.gmail ? '確定すると、お客様に確定メールが届きます。' : '確定しても、お客様には自動で何も届きません。WhatsAppで連絡してください。') + '</div>';
  }
  if (j.done) { $('app').innerHTML = h + '<div class="box red">この予約はもう確定しています（' + esc(j.done) + '）' + (j.via === 'google' ? '・Googleの道' : '') + '</div>'; return; }
  // 本人番号 10/7：リンクの番号と予約した人が違う可能性
  if (j.idWarn) {
    const wa = String(j.tel || '').replace(/[^0-9]/g, '');
    h += '<div class="warn"><b>' + esc(j.idWarn.head) + '</b><br>' + (j.idWarn.why || []).map(esc).join('<br>') +
      '<br>メール：' + (j.mail ? esc(j.mail) : 'なし') + '／WhatsApp：' + (wa ? '<a href="https://wa.me/' + wa + '">' + esc(j.tel) + '</a>' : 'なし') + '</div>';
  }
  if (j.busy && j.busy.length) {
    $('app').innerHTML = h + '<div class="box red">⚠️ この時間はもう予約があります。確定できません。<br>' + j.busy.map(esc).join('<br>') + '</div>'; return;
  }
  if (j.any) {
    h += '<div class="box gray">この日の予定：' + (j.day.length ? '<br>' + j.day.map(esc).join('<br>') : 'なし') + '</div>' +
      '<label>開始時間<input id="tm" class="inp" type="time" step="1800"></label>';
  }
  h += '<label for="pr">料金（ペソ）・幅は「4610〜4750」の形でも可</label>' + // 料金の範囲 10/13：数字だけの欄 → 文字の欄＋「〜」ボタン＋下見
    '<div class="prw"><input id="pr" class="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例 4610 または 4610〜4750" value="' + esc(j.price) + '">' +
    '<button type="button" id="wv" class="wave" aria-label="〜を入れる">〜</button></div><div id="pv" class="pv"></div>' +
    '<label>施術時間（分）<input id="du" class="inp" type="number" inputmode="numeric" step="10" value="' + esc(j.dur) + '"></label><div id="dv" class="pv"></div>' + // 料金の範囲 10/13：施術時間もお客様に出る形を下に（Nory 10/13「アプロックスとか使おうよ」）
    '<label class="chk"><input id="nw" type="checkbox">新規のお客様（題名の先頭に S. をつける）</label>' +
    '<label>カレンダーの題名<input id="ti" class="inp" type="text" value="' + esc(j.title) + '"></label>' +
    (j.kind === 'cambio' ? '<label class="chk"><input id="dl" type="checkbox" checked>今の予約（' + esc(j.cur) + '）のカレンダーの予定を消す</label>' : '') +
    (j.idWarn && j.kind !== 'cambio' ? // 本人番号 10/7：送り方を選ぶ（はじめは Googleの道）
      '<label class="way"><input type="radio" name="via" value="google" checked' + (j.mail ? '' : ' disabled') + '><span><b>お客様のメールに直接確定メールを送る（Googleの道）</b>' +
        '<small>' + (!j.mail ? '⚠️ お客様のメールが無いため選べません。WhatsAppで伝えてください。' : j.gmail ? 'ManyChatには何も入れません（DMは出ません）。お店のGmailから ' + esc(j.mail) + ' へ確定メール、前日朝7時にお知らせメール。' : '⚠️ GOOGLE_MAIL がオフのため、お客様には何も届きません（カレンダーだけ）。WhatsAppで伝えてください。') + '</small></span></label>' +
      '<label class="way"><input type="radio" name="via" value=""' + (j.mail ? '' : ' checked') + '><span><b>今までどおり ManyChat で確定</b>' +
        '<small>確定DM・確定メール・前日メールは、リンクの番号の連絡先に届きます。' + (j.idWarn.owner ? 'この番号は Nory本人なので、メールが合わないと止まります。' : 'メールが合わないと止まります。') + '</small></span></label>' : '') +
    '<button id="go" class="go">この内容で確定する</button><div id="msg"></div>';
  $('app').innerHTML = h;
  LANG = j.lang || ''; // 料金の範囲 10/13：お客様の言語（Apps Script v70 から。無い時は3つの言語を並べる）
  $('pr').oninput = prView; prView(); // 料金の範囲 10/13
  $('du').oninput = duView; duView(); // 料金の範囲 10/13：施術時間の下見
  $('wv').onclick = function(){ const p = $('pr'), v = p.value.replace(/\s*〜\s*$/, ''); p.value = v + '〜'; p.focus(); prView(); };
  $('nw').onchange = function(){ const t = $('ti'); t.value = t.value.replace(/^S\./, ''); if (this.checked) t.value = 'S.' + t.value; };
  $('go').onclick = confirmIt;
}

// 料金の範囲 10/13：Apps Script の priceIn_ と同じ読み方（ここは下見と入れ間違いの注意だけ。決めるのは Apps Script）
function prIn(v){
  const s = String(v == null ? '' : v).normalize('NFKC').replace(/\$|pesos?|ペソ|mxn/gi, '').replace(/\s+/g, ' ').trim();
  if (!s) return { ok: true, min: 0, max: 0 };
  const m = /^(\d[\d,]*)(?:\s*(?:[-‐‑‒–—―−~〜～_ーｰ]+|から)\s*(\d[\d,]*))?$/.exec(s);
  if (!m) return { ok: false };
  const n = x => Number(String(x).replace(/,/g, ''));
  let a = n(m[1]), b = m[2] ? n(m[2]) : 0;
  if (!isFinite(a) || !isFinite(b) || a > 99999 || b > 99999) return { ok: false };
  if (b && b < a) { const t = a; a = b; b = t; }
  if (!(a > 0)) return b ? { ok: false } : { ok: true, min: 0, max: 0 };
  return { ok: true, min: a, max: b > a ? b : 0 };
}
function prView(){
  const p = prIn($('pr').value), e = $('pv'), f = x => Number(x).toLocaleString('en-US');
  e.className = 'pv' + (p.ok ? '' : ' bad');
  e.textContent = !p.ok ? '⚠️ 読めません。「4610」か「4610〜4750」の形で入れてください' :
    !p.min ? '空なので、料金表の金額で確定します' :
    p.max ? 'お客様に出る形：' + (LANG === 'ja' ? f(p.min) + '〜' + f(p.max) + 'ペソ' : LANG ? f(p.min) + '–' + f(p.max) + ' pesos' : f(p.min) + '–' + f(p.max) + ' pesos（日本語のメールは ' + f(p.min) + '〜' + f(p.max) + 'ペソ）') :
    'お客様に出る形：' + f(p.min) + (LANG === 'ja' ? 'ペソ' : ' pesos');
}
// 料金の範囲 10/13：施術時間の「お客様に出る形」。Apps Script の gDur_（es aprox.・en approx.・ja 約）と同じ形。Apps Script と同じく 10〜360分にそろえて見せる
let LANG = '';
function durTxt(m, l){
  if (l === 'ja') return '約' + (m >= 60 ? Math.floor(m / 60) + '時間' : '') + (m % 60 ? m % 60 + '分' : '');
  return (l === 'en' ? 'approx. ' : 'aprox. ') + (m >= 60 ? Math.floor(m / 60) + 'h' : '') + (m % 60 ? (m >= 60 ? ' ' : '') + (m % 60) + 'min' : '');
}
function duView(){
  const v = Number($('du').value), e = $('dv');
  if (!(v > 0)) { e.className = 'pv'; e.textContent = '空なので、予約のときの長さで確定します'; return; }
  const m = Math.max(10, Math.min(360, Math.round(v)));
  e.className = 'pv';
  e.textContent = 'お客様に出る形：' + (LANG ? durTxt(m, LANG) : durTxt(m, 'es') + '（英語 ' + durTxt(m, 'en') + '・日本語 ' + durTxt(m, 'ja') + '）') + (m !== v ? '　※' + m + '分にそろえます' : '');
}
function confirmIt(){
  const b = $('go'), tm = $('tm') ? $('tm').value : '';
  if (!prIn($('pr').value).ok) { $('msg').innerHTML = '<div class="ng">⚠️ 料金の書き方が読めません。「4610」か「4610〜4750」の形で入れてください</div>'; return; } // 料金の範囲 10/13
  if ($('tm') && !/^\d\d:\d\d$/.test(tm)) { $('msg').innerHTML = '<div class="ng">⚠️ 開始時間を入れてください</div>'; return; }
  b.disabled = true; b.textContent = '確定中…'; $('msg').innerHTML = '';
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'confirm', r: R, o: Number(O), k: K, price: $('pr').value, dur: $('du').value, title: $('ti').value, time: tm, delOld: !!($('dl') && $('dl').checked),
      via: (document.querySelector('input[name="via"]:checked') || {}).value || '' }) }) // 本人番号 10/7
    .then(x => x.json())
    .then(x => {
      if (x && x.ok) {
        b.style.display = 'none';
        $('msg').innerHTML = '<div class="ok">' + esc(x.msg || '✅ 確定しました。お客様に確定のDMとメールが届きます。カレンダーにも入れました。') + '</div>';
      } else {
        b.disabled = false; b.textContent = 'この内容で確定する';
        $('msg').innerHTML = '<div class="ng">⚠️ ' + esc((x && x.err) || '確定できませんでした') + '</div>';
      }
    })
    .catch(() => {
      // 通信が切れた時：確定できたか分からないので、押し直す前に読み直して確かめる
      b.disabled = false; b.textContent = 'この内容で確定する';
      $('msg').innerHTML = '<div class="ng">⚠️ 通信が切れました。確定できたか分からないので、<a href="' + esc(location.href) + '">このページを開き直して</a>「もう確定しています」と出ないか見てください。</div>';
    });
}

if (!/^R[0-9A-Za-z]+$/.test(R) || !K || !/^\d$/.test(O)) fail('リンクが正しくありません');
else load(1);

// 読み込み：12秒で止まったら自動でやり直す（最大4回）
function load(n){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 12000);
  if (n > 1) $('app').innerHTML = '<div class="load">読み込み中…（' + n + '回目）</div>';
  fetch(API + '?action=cinfo&r=' + encodeURIComponent(R) + '&o=' + O + '&k=' + encodeURIComponent(K) + '&t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' })
    .then(x => x.json())
    .then(j => { clearTimeout(tm); if (j && j.ok) show(j); else fail((j && j.err) || '読み込めませんでした'); })
    .catch(() => { clearTimeout(tm); if (n < 4) load(n + 1); else fail('読み込めませんでした。電波の良い所で開き直してください。'); });
}
</script>
</body></html>
