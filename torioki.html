<!doctype html>
<!-- 【下書き 2026-10-06 仕組み担当】インスタ（ManyChat）の確定メールのリンク「お取り置きの商品を見る」から開くページ。公開していない。
     置き場所（公開のとき）：thehomehair.com/torioki.html。商品の番号・名前・数・価格だけを ?action=hinfo から読む（名前・電話・メール・日時は出さない）。 -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Productos apartados – The Home Hair</title>
<link href="https://fonts.googleapis.com/css2?family=Diplomata+SC&family=Kaisei+Decol:wght@500;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ec;--ink:#1d1d1d;--line:#e6dfd4;--sub:#666}
body{margin:0;background:var(--paper);font-family:'Yeseva One','Kaisei Decol',Georgia,serif;color:var(--ink)}
.w{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.logo{display:block;width:84px;height:84px;margin:0 auto 6px;border-radius:50%}
h1{font-family:'Diplomata SC',serif;font-size:19px;text-align:center;margin:6px 0 16px;line-height:1.3}
html[lang=ja] h1{font-family:'Kaisei Decol',serif;font-weight:700;font-size:21px}
.card{background:#fff;border-radius:14px;padding:6px 14px}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:0 0 auto}
.it .t{flex:1;min-width:0;font-size:15px;line-height:1.45}
.it .t small{color:var(--sub)}
.it .p{white-space:nowrap;font-size:15px}
.tot{display:flex;justify-content:space-between;border-top:1px solid #444;margin-top:4px;padding:10px 0 6px;font-weight:bold}
.n{font-size:13px;color:var(--sub);line-height:1.6;margin:12px 4px 0}
.err{text-align:center;color:var(--sub);margin-top:30px}
</style></head><body><div class="w">
<img class="logo" src="logo_round.png" alt="THE HOME">
<h1 id="h"></h1><div id="c" class="card" style="display:none"></div><p id="n" class="n"></p><p id="e" class="err"></p>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxGGZm0AkELBjTBPFG9R-02Gd5347Y1T3UPLeorJtgmFA6H3QC7FAk7Zq5Qk-TVc31C/exec';
const q=new URLSearchParams(location.search);
const L=({es:1,en:1,ja:1})[q.get('lang')]?q.get('lang'):'es';document.documentElement.lang=L;
const T={es:{h:'Productos apartados',each:'c/u',tot:'Total de productos',ask:'Precio en el salón',n:'Precio de salón, IVA incluido. El pago se realiza en el salón el día de su visita. Si algún producto no estuviera disponible, nosotros le avisaremos.',e:'No encontramos esta información. Si tiene dudas, escríbanos por WhatsApp.'},
 en:{h:'Products on hold',each:'each',tot:'Products total',ask:'Price at the salon',n:'Salon price, VAT (IVA) included. Payment is made at the salon on the day of your visit. If any item is unavailable, we will contact you.',e:'We could not find this information. If you have questions, message us on WhatsApp.'},
 ja:{h:'お取り置きの商品',each:'1点',tot:'商品の合計',ask:'価格は店頭にて',n:'サロン価格・IVA（税）込み。お支払いはご来店時に店頭で承ります。在庫がない商品があった場合は、こちらからご連絡いたします。',e:'情報が見つかりませんでした。ご不明な点はWhatsAppでお問い合わせください。'}}[L];
const $=i=>document.getElementById(i),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),m=n=>'$'+Number(n).toLocaleString('en-US');
$('h').textContent=T.h;
fetch(API+'?action=hinfo&r='+encodeURIComponent(q.get('r')||'')+'&k='+encodeURIComponent(q.get('k')||'')).then(x=>x.json()).then(j=>{
 if(!j||!j.ok){$('e').textContent=T.e;return;}
 const all=j.items.every(x=>x.salon),tot=j.items.reduce((a,x)=>a+(x.salon||0)*x.n,0);
 $('c').innerHTML=j.items.map(x=>'<div class="it"><img src="'+esc(x.img)+'" alt=""><div class="t"><b>'+esc(x.name)+'</b> <small>'+esc(x.size)+'</small><br><small>×'+x.n+(x.salon?'　'+(L==='ja'?T.each+' '+m(x.salon):m(x.salon)+' '+T.each):'')+'</small></div><div class="p">'+(x.salon?m(x.salon*x.n):esc(T.ask))+'</div></div>').join('')+(all?'<div class="tot"><span>'+T.tot+'</span><span>'+m(tot)+' MXN</span></div>':'');
 $('c').style.display='block';$('n').textContent=T.n;
}).catch(()=>{$('e').textContent=T.e;});
</script></body></html>
