<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta charset="utf-8"><title>THE HOME Hair re-creative – Horario</title><meta property="og:title" content="Horario – THE HOME Hair re-creative"><meta property="og:description" content="Calle Ensenada 138, Condesa, CDMX"><meta property="og:image" content="https://thehomehair.com/og_reserva_20261007.png"><meta property="og:type" content="website">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1ec;font-family:'Yeseva One','Kaisei Decol',serif;color:#1d1d1d}
.w{width:100%;max-width:480px;overflow-x:hidden;margin:0 auto;background:#fff;min-height:100vh;padding:18px 16px 40px}
.logo{display:block;width:110px;height:110px;margin:4px auto 6px;border-radius:50%}
h1{font-family:'Diplomata SC',serif;font-size:22px;text-align:center;margin:6px 0 0;letter-spacing:.5px}
.sub{text-align:center;font-size:14px;color:#555;margin:4px 0 14px}
.langs{text-align:center;margin:2px 0 10px;font-size:13px}.langs a{color:#888;text-decoration:none;margin:0 8px}.langs a.on{color:#1d1d1d;font-weight:bold;text-decoration:underline}
.step{margin:18px 0 8px;font-size:17px;border-bottom:1px solid #ddd;padding-bottom:6px}
.hint{font-size:13px;color:#888;font-family:'Kaisei Decol',serif}
.today{border-radius:16px;padding:16px 14px;text-align:center;margin-top:4px}
.today.open{background:#e9f3ea}
.today.shut{background:#fdecee}
.today .lab{font-size:13px;color:#555;font-family:'Kaisei Decol',serif}
.today .big{font-size:26px;margin:4px 0 2px;line-height:1.25}
.today.open .big{color:#1f6b33}
.today.shut .big{color:#b00020}
.today.full{background:#f1efea}
.today.full .big{color:#555}
.today .det{font-size:15px;line-height:1.5}
.cal-h{font-size:18px;margin:16px 0 6px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.dow{font-size:12px;color:#888;padding:4px 0}
.d{border-radius:10px;padding:6px 0 5px;font-size:16px;line-height:1.1;min-height:46px}
.d small{display:block;font-size:10px;margin-top:3px;font-family:'Kaisei Decol',serif;white-space:nowrap}
.d.op{background:#e9f3ea;color:#1d1d1d}.d.op small{color:#1f6b33}
.d.fx{background:#f1efea;color:#aaa}.d.fx small{color:#aaa}
.d.tm{background:#fdecee;color:#b00020}.d.tm small{color:#b00020}
.d.out{background:none;color:#ddd}
.d.blank{background:none}
.d.now{box-shadow:0 0 0 2px #1d1d1d}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:10px 0 2px;font-size:13px;font-family:'Kaisei Decol',serif}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:8px 4px;border-bottom:1px solid #eee}
.hours td:last-child{text-align:right}
.note{font-size:13px;line-height:1.5;margin-top:8px;font-family:'Kaisei Decol',serif;color:#555}
.warn{background:#fff4e5;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:12px;font-family:'Kaisei Decol',serif}
.go{display:block;width:100%;margin-top:18px;padding:15px;border:none;border-radius:14px;background:#b00020;color:#fff;font:inherit;font-size:18px;text-align:center;text-decoration:none}
.go2{display:block;width:100%;margin-top:10px;padding:14px;border:1.5px solid #222;border-radius:14px;background:#fff;color:#222;font:inherit;font-size:17px;text-align:center;text-decoration:none}
.d{position:relative}
.d.op[data-av]::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%}
.d.op[data-av=ok]::after{background:#1f6b33}
.d.op[data-av=few]::after{background:#e08a00}
.d.op[data-av=full]::after{background:#555}
.d.op[data-av=full]{background:#f1efea}.d.op[data-av=full] small{color:#555}
.legend .dot{width:9px;height:9px;border-radius:50%}
.avline{text-align:center;font-size:13px;margin-top:6px;font-family:'Kaisei Decol',serif;color:#555}
.addr{text-align:center;font-size:13px;color:#777;margin-top:16px;font-family:'Kaisei Decol',serif}
</style>

@media (min-width:820px){:root{--fz:46px}}
.fz{position:fixed;z-index:40;pointer-events:none;background-color:var(--cream)}
.fz-t,.fz-b{left:var(--fz);right:var(--fz);height:var(--fz);background-repeat:round no-repeat;background-size:calc(var(--fz)*12.5) 100%}
.fz-t{background-image:var(--fz-t)}.fz-b{background-image:var(--fz-b)}
.fz-t{top:0}.fz-b{bottom:0}
.fz-l,.fz-r{top:var(--fz);bottom:var(--fz);width:var(--fz);background-repeat:no-repeat round;background-size:100% calc(var(--fz)*12.5)}
.fz-l{background-image:var(--fz-l)}.fz-r{background-image:var(--fz-r)}
.fz-l{left:0}.fz-r{right:0}
/* 四隅：ドットの帯が角で回りこみ、角に少し大きめのドット・ジグザグは角でも辺と同じリズムで山が続く（10/6 Nory） */
.fz-c{z-index:41;width:calc(var(--fz)*1.3334);height:calc(var(--fz)*1.3334);background:var(--fz-c) center/100% 100% no-repeat}
.fz-tl{top:0;left:0}.fz-tr{top:0;right:0;transform:scaleX(-1)}.fz-bl{bottom:0;left:0;transform:scaleY(-1)}.fz-br{bottom:0;right:0;transform:scale(-1,-1)}
/* パソコンの右下だけは♪ボタンの近くでスペースがないので、山の代わりにクリーム色の逆向きの山（へこみ）にする（10/6 Nory） */
@media (min-width:820px){.fz-c.fz-br{background-image:var(--fz-c2)}}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);overflow-x:hidden;padding:var(--fz)}
.w{background:transparent;min-height:0;padding:22px 16px 40px}
/* 店名：オリジナルのフォント（トップの上のバーの店名と同じ形・2段） */
.sub.brand{display:flex;flex-direction:column;align-items:center;line-height:.95;font-family:var(--display);font-size:clamp(32px,11vw,47px);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:8px 0 18px;white-space:nowrap}
.sub.brand .b2{font-size:.46em;letter-spacing:.1em;margin-top:4px}
/* 見出し：トップの見出しと同じ字・色＋下に蛇 */

:lang(ja) h1{text-transform:none;font-weight:500;font-size:clamp(26px,7.6vw,38px);letter-spacing:.04em}
.step{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--accent);font-size:24px;line-height:1.15;letter-spacing:.02em;border-bottom:0;margin:30px 0 14px;display:table}
:lang(ja) .step{text-transform:none;font-weight:500;font-size:22px;letter-spacing:.04em}
.step,.cal-h,h1{font-variant-numeric:lining-nums}

/* 言語の切りかえ：トップと同じ（えらばれている言語の下に小さい蛇） */

.langs a{position:relative;margin:0;padding:2px 0 11px;color:var(--mute);text-decoration:none;white-space:nowrap}
.langs a.on{color:var(--accent);font-weight:400;text-decoration:none}
.langs a.on::after{content:"";position:absolute;left:-4px;right:-4px;bottom:0;height:10px;box-sizing:border-box;padding:0 15px 0 0;
 background:var(--lk-head) right center/16px 10px no-repeat,var(--lk-body) left center/10px 10px round no-repeat;
 background-origin:border-box,content-box;background-clip:border-box,content-box;pointer-events:none}
/* 今日の箱・カレンダー（色・中身はそのまま。字だけトップに合わせる） */
.today{border-radius:4px}
.today .big{font-family:var(--serif);font-weight:500}
.d{font-family:var(--serif);font-size:18px;font-variant-numeric:lining-nums;border-radius:6px}
.d small{font-family:var(--sans);font-size:10px}
.dow{font-family:var(--sans);letter-spacing:.04em;color:var(--mute)}
.d.now{box-shadow:0 0 0 2px var(--ink)}
.hours{font-size:15px}
.hours td{border-bottom:1px solid var(--line)}
/* 小さい説明の字：トップと同じ（スペイン語・英語＝Special Elite／日本語＝Klee One） */
:lang(es) .hint,:lang(en) .hint,:lang(es) .note,:lang(en) .note,:lang(es) .warn,:lang(en) .warn,:lang(es) .legend,:lang(en) .legend,:lang(es) .avline,:lang(en) .avline,:lang(es) .addr,:lang(en) .addr,:lang(es) .today .lab,:lang(en) .today .lab,:lang(es) .today .det,:lang(en) .today .det,:lang(es) .hours,:lang(en) .hours{font-family:'Special Elite','Montserrat',sans-serif}
:lang(ja) .hint,:lang(ja) .note,:lang(ja) .warn,:lang(ja) .legend,:lang(ja) .avline,:lang(ja) .addr,:lang(ja) .today .lab,:lang(ja) .today .det,:lang(ja) .hours{font-family:'Klee One','Kaisei Decol',serif}
.note,.addr,.avline{color:var(--mute)}
.warn{background:var(--sand);border-radius:4px}
/* ボタン：トップと同じ丸いボタン（予約＝朱色の地／ほか＝線と内側の点の縁取り） */
.go,.go2{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border-radius:999px;padding:10px 20px;font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;line-height:1.35;text-align:center;text-decoration:none;transition:background .25s,color .25s,border-color .25s}
:lang(ja) .go,:lang(ja) .go2{letter-spacing:.06em;font-size:14px}
.go{background:var(--accent);color:#fff;border:1px solid var(--accent)}
.go:hover{background:var(--accent-d);border-color:var(--accent-d)}
#bookWa{border-color:#1f7a4d}
.go2{position:relative;background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.go2::before{content:"";position:absolute;inset:4px;border-radius:999px;border:2.5px dotted currentColor;opacity:.75;pointer-events:none}
.go2:hover{background:var(--accent);color:#fff}
/* 凡例の四角：ベージュの上でも見えるよう細い線 */
.legend i:not(.dot){box-shadow:inset 0 0 0 1px var(--line)}
/* 満席の印は赤（10/8 Nory） */
.d.op[data-av=full]::after{background:var(--full)}
.d.op[data-av=full] small{color:var(--full)}
/* 見出しの下の蛇の動き（トップと同じ）：画面に入ると伸びる・ときどきくねる・触るとくねる。動きを減らす設定の人には動かさない */
@keyframes hzGrow{0%{width:0;opacity:0}12%{opacity:1}}
@keyframes hzWig{0%,100%{transform:none}25%{transform:translateY(-1.5px) skewX(-9deg)}75%{transform:translateY(1.5px) skewX(9deg)}}
@keyframes hzIdle{0%,12%,100%{transform:none}2%{transform:translateY(-1px) skewX(-7deg)}5%{transform:translateY(1px) skewX(7deg)}8%{transform:translateY(-.8px) skewX(-5deg)}10.5%{transform:translateY(.5px) skewX(3deg)}}
@keyframes hzHov{0%,100%{transform:none}15%{transform:translateY(-1.6px) skewX(-11deg)}35%{transform:translateY(1.6px) skewX(10deg)}55%{transform:translateY(-1px) skewX(-7deg)}75%{transform:translateY(.6px) skewX(4deg)}}
@media (prefers-reduced-motion:no-preference){
 .hz-js .hz:not(.hz-in)::after{width:0!important;opacity:0!important}
 .hz-js .hz.hz-in::after{transform-origin:left center;animation:hzGrow 1s cubic-bezier(.3,.6,.35,1) both,hzWig .25s ease-in-out 0s 4,hzIdle 6.5s ease-in-out calc(1.6s + var(--hz-d,0s)) infinite}
 .hz-js .hz.hz-in.hz-done::after{animation:hzIdle 6.5s ease-in-out var(--hz-d,0s) infinite}
 .hz-js .hz.hz-in.hz-done.hz-wig::after{animation:hzHov .5s ease-in-out 1}
 .langs a.on.hz-wig::after{transform-origin:left center;animation:hzHov .5s ease-in-out 1}
}
/* ===== お休みの日のマス（10/8 Nory「灰色のマスをページに合うおしゃれな見た目に」）
   定休日＝古い版画のような手描きの斜線（静かに休み）／臨時休業＝朱色の点々（民芸の水玉）＋点線の枠（スタンプ風）。数字ははっきり読める濃さ ===== */
:root{
 --off-hatch:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 12%22%3E%3Cpath d=%22M-1 7 Q3.4 3.2 7 -1 M-1 13 Q6.6 5.4 13 -1 M5 13 Q8.8 9.6 13 5%22 fill=%22none%22 stroke=%22%233a2a20%22 stroke-opacity=%22.17%22 stroke-width=%22.9%22 stroke-linecap=%22round%22/%3E%3C/svg%3E");
 --off-dots:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22%3E%3Ccircle cx=%222.5%22 cy=%222.6%22 r=%221.05%22 fill=%22%23b4532a%22 fill-opacity=%22.30%22/%3E%3Ccircle cx=%227.4%22 cy=%227.5%22 r=%22.95%22 fill=%22%23b4532a%22 fill-opacity=%22.30%22/%3E%3C/svg%3E");
}
.d.fx{background:var(--sand) var(--off-hatch) 0 0/12px 12px repeat;color:#6a5444}
.d.fx small{color:#6a5444}
.d.tm{background:var(--cream) var(--off-dots) 0 0/10px 10px repeat;color:var(--accent-d)}
.d.tm small{color:var(--accent-d)}
.d.tm::before{content:"";position:absolute;inset:1px;border:1.4px dashed var(--accent);border-radius:5px;opacity:.75;pointer-events:none}
/* 凡例の四角も同じ見た目に（文字・中身はそのまま） */
.legend:not(#avLeg)>span:nth-child(2) i{background:var(--sand) var(--off-hatch) 0 0/8px 8px repeat!important}
.legend:not(#avLeg)>span:nth-child(3) i{position:relative;background:var(--cream) var(--off-dots) 0 0/7px 7px repeat!important;box-shadow:inset 0 0 0 1.2px var(--accent)}

avOk:{es:'Hay espacio',en:'Available',ja:'空きあり'},
avFew:{es:'Quedan pocos',en:'Few left',ja:'残りわずか'},
avFull:{es:'Lleno',en:'Fully booked',ja:'満席'},
fullS:{es:'lleno',en:'full',ja:'満席'},
waitDM:{es:'Días llenos: lista de espera por DM.',en:'Fully booked days: join the waitlist by DM.',ja:'満席の日のキャンセル待ちはDMでどうぞ。'},
checkAv:{es:'🔎 Ver disponibilidad en la página de reservas',en:'🔎 Check availability on the booking page',ja:'🔎 予約ページで空きを確認'},
book:{es:'📅 Reservar cita',en:'📅 Book an appointment',ja:'📅 予約する'},
shop:{es:'🛍 Ver productos',en:'🛍 See products',ja:'🛍 商品を見る'},
};
const T=k=>TX[k][LANG];
const DIAS={es:['dom','lun','mar','mié','jue','vie','sáb'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ja:['日','月','火','水','木','金','土']}[LANG];
const DIASL={es:['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ja:['日曜','月曜','火曜','水曜','木曜','金曜','土曜']}[LANG];
const MESES={es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],en:['January','February','March','April','May','June','July','August','September','October','November','December'],ja:null}[LANG];
// 営業時間（分）資料/美容室.md：火〜金 10:00〜19:00／土 10:00〜20:00／日 10:00〜17:00
const HOURS={2:[600,1140],3:[600,1140],4:[600,1140],5:[600,1140],6:[600,1200],0:[600,1020]};
const hm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function nowMx(){const s=new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'});return new Date(s);}
const NOW=nowMx(); const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const LAST=new Date(TODAY); LAST.setDate(LAST.getDate()+59); // 今日を入れて60日
let CLOSEDX=[], OPENX=[];
let AV=null; // 空き状況 {日付:{f:空き,t:全部}}。読めない時は null（印を出さない）
// 'ok'＝空きあり / 'few'＝残りわずか / 'full'＝満席 / ''＝データなし
function avOf(d){const a=AV&&AV[ymd(d)];if(!a||typeof a.f!=='number'||!a.t)return '';if(a.f<=0)return 'full';if(a.f<=3||a.f/a.t<=0.25)return 'few';return 'ok';}
// 決まった休み（予約ページの closed() と同じ）
function fixedOff(d){const w=d.getDay(),n=Math.ceil(d.getDate()/7);if(w===1)return true;if(w===2&&(n===1||n===3))return true;if(w===0&&n===3)return true;return false;}
// 'op'＝営業 / 'fx'＝定休日 / 'tm'＝臨時休業
function status(d){const k=ymd(d),tmp=EXTRA.indexOf(k)>=0||CLOSEDX.indexOf(k)>=0;
 if(EXTRA.indexOf(k)<0&&OPENX.indexOf(k)>=0)return 'op';
 if(fixedOff(d))return 'fx';
 if(tmp)return 'tm';
 return 'op';}
const dateTxt=d=>LANG==='ja'?(d.getMonth()+1)+'月'+d.getDate()+'日（'+DIAS[d.getDay()]+'）':LANG==='es'?DIASL[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]:DIASL[d.getDay()]+', '+MESES[d.getMonth()]+' '+d.getDate();
const range=h=>h?hm(h[0])+'–'+hm(h[1]):'';

function drawToday(){const box=document.getElementById('today'),big=document.getElementById('tBig'),det=document.getElementById('tDet');
 const st=status(TODAY),h=HOURS[TODAY.getDay()],m=NOW.getHours()*60+NOW.getMinutes();
 if(st==='op'&&h&&m<h[1]){box.className='today open';
  if(m>=h[0]){big.textContent=T('openNow');det.textContent=LANG==='ja'?hm(h[1])+' '+T('until'):T('until')+' '+hm(h[1]);}
  else{big.textContent=T('openLater');det.textContent=range(h);}
  const av=avOf(TODAY);
  if(av==='full'){box.className='today full';big.textContent=T('fullToday');
   const d=new Date(TODAY);let nf=null;for(let i=1;i<=60;i++){d.setDate(d.getDate()+1);if(status(d)==='op'&&avOf(d)!=='full'){nf=new Date(d);break;}}
   det.textContent=range(h)+(nf?' · '+T('nextFree')+' '+dateTxt(nf):'');return;}
  if(av)det.textContent+=' · '+T(av==='ok'?'avOk':'avFew');
  return;}
 if(st==='op'&&!h){box.className='today open';big.textContent=T('openLater');det.textContent='';return;}
 box.className='today shut';big.textContent=(st==='op')?T('closedNow'):T('closedToday');
 const d=new Date(TODAY);let found=null;for(let i=1;i<=60;i++){d.setDate(d.getDate()+1);if(status(d)==='op'){found=new Date(d);break;}}
 det.textContent=found?T('next')+' '+dateTxt(found)+(HOURS[found.getDay()]?' · '+range(HOURS[found.getDay()]):''):'';}

function drawCals(){const box=document.getElementById('cals');box.innerHTML='';let anyFull=false;
 let m=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
 while(m<=LAST){const h=document.createElement('div');h.className='cal-h';
  h.textContent=LANG==='ja'?m.getFullYear()+'年'+(m.getMonth()+1)+'月':MESES[m.getMonth()]+' '+m.getFullYear();box.appendChild(h);
  const g=document.createElement('div');g.className='grid';
  DIAS.forEach(x=>{const e=document.createElement('div');e.className='dow';e.textContent=x;g.appendChild(e);});
  for(let i=0;i<m.getDay();i++){const e=document.createElement('div');e.className='d blank';g.appendChild(e);}
  const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  for(let i=1;i<=days;i++){const d=new Date(m.getFullYear(),m.getMonth(),i),e=document.createElement('div');
   if(d>LAST)break;
   if(d<TODAY){e.className='d out';e.textContent=i;}
   else{const st=status(d),hh=HOURS[d.getDay()];e.className='d '+st+(ymd(d)===ymd(TODAY)?' now':'');
    const av=st==='op'?avOf(d):'';if(av){e.dataset.av=av;if(av==='full')anyFull=true;}
    const s=document.createElement('small');s.textContent=st==='op'?(av==='full'?T('fullS'):hh?hm(hh[0]).slice(0,2)+'–'+hm(hh[1]).slice(0,2):T('op')):T('cl');
    e.textContent=i;e.appendChild(s);e.title=dateTxt(d)+' · '+(st==='op'?(range(hh)||T('op'))+(av?' · '+T(av==='ok'?'avOk':av==='few'?'avFew':'avFull'):''):st==='fx'?T('lgFix'):T('lgTmp'));}
   g.appendChild(e);}
  box.appendChild(g);m=new Date(m.getFullYear(),m.getMonth()+1,1);}
 const has=!!AV&&Object.keys(AV).length>0;
 document.getElementById('avLeg').style.display=has?'flex':'none';
 document.getElementById('waitDM').style.display='none'; // キャンセル待ちはNoryが決めるまで出さない
 document.getElementById('checkAv').style.display=(has||!ID)?'none':'block';/* 【下書き 10/5】idなしは出さない（予約ボタンでDMへ） */}

function drawHours(){const t=document.getElementById('hours');t.innerHTML='';
 [2,3,4,5,6,0,1].forEach(w=>{const r=document.createElement('tr');r.innerHTML='<td></td><td></td>';
  r.cells[0].textContent=DIASL[w];r.cells[1].textContent=HOURS[w]?range(HOURS[w]):T('cl');t.appendChild(r);});}

function draw(){document.documentElement.lang=LANG;
 document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=T(e.dataset.t);});
 const L=document.getElementById('langs');L.innerHTML='';
 LANGS.forEach(l=>{const a=document.createElement('a');a.href='#';a.textContent=l==='ja'?'日本語':l==='en'?'English':'Español';if(l===LANG)a.className='on';
  a.onclick=e=>{e.preventDefault();location.search='?lang='+l+(ID?'&id='+ID:'');};L.appendChild(a);});
 document.getElementById('book').href=ID?RESERVA+'?lang='+LANG+'&id='+ID:IGDM; {const w=document.getElementById('bookWa');if(ID){w.style.display='none';}else{w.style.display='';w.textContent={es:'💬 Reservar por WhatsApp',en:'💬 Book via WhatsApp',ja:'💬 WhatsAppで予約する'}[LANG]||'💬 Reservar por WhatsApp';w.href='https://wa.me/525521798065?text='+encodeURIComponent({es:'Hola, me gustaría agendar una cita.',en:'Hello, I would like to book an appointment.',ja:'こんにちは。予約をお願いしたいです。'}[LANG]||'Hola, me gustaría agendar una cita.');}} // 【下書き 10/5】idなしはインスタDMへ
 document.getElementById('checkAv').href=RESERVA+'?lang='+LANG+(ID?'&id='+ID:'');
 document.getElementById('shop').href=SHOP+'?lang='+LANG+(ID?'&id='+ID:'');
 drawToday();drawCals();drawHours();}
draw();

// お店のGoogleカレンダーの「休み・Close」など（読むだけ）。読めない時は決まった休みだけ＋Instagramの1行
const ctl=('AbortController' in window)?new AbortController():null;
const tmo=setTimeout(()=>{if(ctl)ctl.abort();},12000);
fetch(API+'?action=closed',ctl?{signal:ctl.signal}:{}).then(x=>x.json()).then(j=>{clearTimeout(tmo);
 if(!j||!Array.isArray(j.closed))throw 0;
 CLOSEDX=j.closed;OPENX=Array.isArray(j.open)?j.open:[];
 document.getElementById('okData').style.display='block';draw();
}).catch(()=>{clearTimeout(tmo);document.getElementById('noData').style.display='block';});
// 空き状況（本番にはまだない ?action=availability。USE_AV=false のあいだは呼ばない → 印なし＋「予約ページで空きを確認」）
if(USE_AV)fetch(API+'?action=availability').then(x=>x.json()).then(j=>{if(j&&typeof j==='object'&&!Array.isArray(j)&&Object.keys(j).length){AV=j;draw();}}).catch(()=>{});
</script>

<script>(function(){var a=document.getElementById('homeL'),t={es:'Inicio',en:'Home',ja:'ホーム'};function u(){var l=document.documentElement.lang;if(!t[l])l='es';a.textContent='← '+t[l];a.href='/?lang='+l;}u();new MutationObserver(u).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});})();</script>
<!-- 【10/6】Googleアナリティクスのお知らせ（小さく1行・ページの言語に合わせる） -->
<script>(function(){var t={es:'Este sitio usa Google Analytics para contar las visitas.',en:'This site uses Google Analytics to count visits.',ja:'このサイトはアクセス数を数えるため Google アナリティクスを使っています。'};var p=document.createElement('p');p.className='ga-note';p.style.cssText='margin:4px auto 12px;padding:0 16px;max-width:520px;text-align:center;font-size:11px;line-height:1.5;color:#8a7663;opacity:.9;position:relative;z-index:1';function L(){var l=(document.documentElement.lang||new URLSearchParams(location.search).get('lang')||navigator.language||'es').slice(0,2).toLowerCase();return t[l]?l:'es';}function u(){p.textContent=t[L()];}u();document.body.appendChild(p);try{new MutationObserver(u).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});}catch(e){}})();</script>
<script>
/* 【10/8 Nory】見出しの下の蛇（トップと同じ動き）。動きを減らす設定の人・古いブラウザでは止まった蛇のまま */
(function(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
if('IntersectionObserver' in window){document.documentElement.classList.add('hz-js');
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.style.setProperty('--hz-d',(Math.random()*3).toFixed(2)+'s');t.classList.add('hz-in');setTimeout(function(){t.classList.add('hz-done');},1150);io.unobserve(t);}});},{threshold:.6});
document.querySelectorAll('.hz').forEach(function(h){io.observe(h);});}
var SEL='.hz,.langs';
function tgt(h){if(h.classList.contains('langs'))return h.querySelector('a.on');if(!h.classList.contains('hz-done'))return null;return h;}
function wig(h){var t=h&&tgt(h);if(!t)return;t.classList.remove('hz-wig');void t.offsetWidth;t.classList.add('hz-wig');clearTimeout(t._hzw);t._hzw=setTimeout(function(){t.classList.remove('hz-wig');},560);}
function host(n){return n&&n.closest?n.closest(SEL):null;}
document.addEventListener('pointerover',function(e){if(e.pointerType!=='mouse')return;var h=host(e.target);if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget)))wig(h);},{passive:true});
document.addEventListener('pointerout',function(e){if(e.pointerType!=='mouse')return;var h=host(e.target);if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget)))wig(h);},{passive:true});
document.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;wig(host(e.target));},{passive:true});
}catch(e){}})();
</script>
